name: magic-auth

services:
  api:
    build:
      context: .
      target: app
    command: npm run start:dev
    container_name: api
    ports:
      - '88:3000'
    restart: always
    volumes:
      - ./:/app

  database:
    environment:
      POSTGRES_PASSWORD: postgres
    image: postgres:18.3
    ports:
      - '5432:5432'
    restart: always
    volumes:
      - ./.docker/postgres:/var/lib/postgresql
