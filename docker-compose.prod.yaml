name: magic-auth-api

services:
  api:
    command: npm run start:prod
    container_name: magic-auth-api
    environment:
      DATABASE_URL: ${DATABASE_URL?required}
    image: ghcr.io/dusanmlynarcikdev/magic-auth-api:${API_VERSION:-latest}
    ports:
      - '${API_PORT:-8082}:3000'
    pull_policy: always
    restart: always
