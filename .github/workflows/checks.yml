name: Checks

on: pull_request

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start database
        run: |
          docker network create network
          docker run -d \
            --name database \
            --network network \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=test \
            postgres:18.3

      - name: Build
        run: docker build --target build -t api .

      - name: Tests
        run: docker run --network network api npm run test:cov

      - name: Lint
        run: docker run api npm run lint

      - name: Format
        run: docker run api npm run format:check
